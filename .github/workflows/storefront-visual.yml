name: CHR Storefront Visual QA
on:
  pull_request:
    paths:
      - 'storefront/**'
      - 'src/storefront-admin.js'
      - '.github/workflows/storefront-visual.yml'
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned visual test runner
        run: npm install --no-save @playwright/test@1.65.1
      - name: Install browser dependencies
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests and screenshots
        run: npx playwright test --config storefront/playwright.config.cjs
      - name: Export screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chr-storefront-visual-evidence
          path: |
            artifacts/
            storefront/test-results/
          if-no-files-found: ignore
          retention-days: 7
