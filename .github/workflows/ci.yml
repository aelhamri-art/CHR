name: CHR Quality Gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax + unit tests
        run: npm run verify
      - name: Validate no forbidden backend keys
        run: |
          if grep -rE --exclude-dir=.git '(service_role|sb_secret_)' config.js src; then
            echo 'Forbidden server-side key reference'; exit 1
          fi
      - name: Package independent static preview
        uses: actions/upload-artifact@v4
        with:
          name: axium-chr-static-preview
          path: |
            index.html
            config.js
            src/
            storefront/
          retention-days: 7
